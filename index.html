<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="description" content="Daybook — private notes, budget and subscription tracker that lives on your device.">
<title>Daybook</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="theme-color" content="#FAFAFA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E0E10" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Daybook">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Minimal rectilinear theme: neutral greys, one ink accent, square flat surfaces, Geist + Geist Mono. */
:root{
  --bg:#FAFAFA; --surface:#FFFFFF; --surface-2:#F2F2F3; --text:#111113; --muted:#646469;
  --border:#E9E9EB; --border-strong:#D4D4D8;
  --accent:#111113; --accent-hover:#2C2C30; --on-accent:#FFFFFF; --accent-soft:#EFEFF1;
  --expense:#9C4A2F; --expense-soft:#F7EEEA; --income:#1E7548; --income-soft:#E9F4EE;
  --warn:#8A5A00; --warn-soft:#FBF3E2; --danger:#C0262D; --danger-soft:#FCEBEC;
  --shadow:none;
  --radius:0;
  --font-ui:'Geist',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --font-display:var(--font-ui);
  --font-mono:'Geist Mono',ui-monospace,'Cascadia Mono',Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E0E10; --surface:#161618; --surface-2:#1F1F22; --text:#EDEDEF; --muted:#9A9AA0;
    --border:#252528; --border-strong:#36363B;
    --accent:#EDEDEF; --accent-hover:#FFFFFF; --on-accent:#111113; --accent-soft:#242427;
    --expense:#E39C82; --expense-soft:#2A1F1B; --income:#6FCF97; --income-soft:#18261E;
    --warn:#E3B341; --warn-soft:#2B2414; --danger:#F4736A; --danger-soft:#2E1A1A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E0E10; --surface:#161618; --surface-2:#1F1F22; --text:#EDEDEF; --muted:#9A9AA0;
  --border:#252528; --border-strong:#36363B;
  --accent:#EDEDEF; --accent-hover:#FFFFFF; --on-accent:#111113; --accent-soft:#242427;
  --expense:#E39C82; --expense-soft:#2A1F1B; --income:#6FCF97; --income-soft:#18261E;
  --warn:#E3B341; --warn-soft:#2B2414; --danger:#F4736A; --danger-soft:#2E1A1A;
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-ui);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
p{margin:0 0 10px}
.ic{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:square;stroke-linejoin:miter}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.skip{position:absolute;left:12px;top:-80px;z-index:200;background:var(--accent);color:var(--on-accent);padding:10px 14px;border-radius:0;border:0;font-weight:600;cursor:pointer}
.skip:focus{top:12px}

/* Layout */
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100dvh}
.side{position:sticky;top:0;height:100dvh;display:flex;flex-direction:column;gap:22px;padding:28px 14px 20px;border-right:1px solid var(--border)}
.nav{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:0;color:var(--muted);text-decoration:none;font-weight:500;min-height:44px;transition:background-color .15s,color .15s;touch-action:manipulation}
@media (hover:hover){.nav a:hover{background:var(--surface-2);color:var(--text)}}
.nav a[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.lbl-short{display:none}
.side-foot{margin-top:auto;display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:0 6px}
.backup-pill{display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border-radius:0;font-size:13px;font-weight:500;text-decoration:none;color:var(--muted);background:var(--surface-2);min-height:34px;white-space:nowrap}
.backup-pill .ic{width:16px;height:16px}
.backup-pill.ok{color:var(--income);background:var(--income-soft)}
.backup-pill.warn{color:var(--warn);background:var(--warn-soft)}
.mobile-top{display:none}
main{width:100%;max-width:760px;margin:0 auto;padding:44px 32px 96px}

/* Type */
.page-head{margin-bottom:24px;display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.eyebrow{margin:0 0 4px;color:var(--muted);font-size:14px;font-weight:500}
h1{font-family:var(--font-display);font-weight:600;font-size:clamp(26px,4vw,32px);line-height:1.15;letter-spacing:-.025em;margin:0;text-wrap:balance}
h1:focus{outline:none}
h2{font-family:var(--font-mono);font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:500;margin:0 0 10px}
.stat-label{font-family:var(--font-mono);font-size:11.5px!important;text-transform:uppercase;letter-spacing:.06em}
.stat-value,.amt,.cap-amt,.cat-nums,.chart-axis,.chart-sum,.sub-meta,.entry-meta{font-family:var(--font-mono)}
.stat-value{letter-spacing:-.03em!important}
h3{font-size:17px;margin:0 0 4px;font-weight:600}
section{margin-bottom:28px}
.section-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.section-head a,.link-btn{font-size:14px;font-weight:500;background:none;border:0;color:var(--accent);cursor:pointer;padding:4px 0;text-decoration:none}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}

/* Surfaces */
.card{background:var(--surface);border:1px solid var(--border);border-radius:0;box-shadow:var(--shadow)}
.capture{padding:14px 16px 12px;transition:border-color .15s,box-shadow .15s}
.capture:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft),var(--shadow)}
.capture textarea{display:block;width:100%;border:0;background:transparent;resize:none;font-size:18px;line-height:1.5;padding:4px 2px;min-height:58px;max-height:45vh;outline:none}
.capture textarea::placeholder{color:var(--muted)}
.cap-bar{display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap;margin-top:8px;padding-top:10px;border-top:1px dashed var(--border)}
.cap-preview{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-height:36px}
.cap-amt{font-weight:600;font-variant-numeric:tabular-nums}
.cap-amt.missing{color:var(--warn);font-weight:500;font-size:14px}
.hint{margin:8px 2px 0;font-size:13px;color:var(--muted)}
kbd{font-family:inherit;font-size:12px;padding:1px 6px;border-radius:0;border:1px solid var(--border-strong);background:var(--surface-2)}

.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:0;border:1px solid var(--border);background:var(--surface-2);font-size:14px;font-weight:500;cursor:pointer;min-height:36px;touch-action:manipulation;transition:background-color .15s,border-color .15s}
.chip:hover{border-color:var(--border-strong)}
.chip .ic{width:16px;height:16px}
.chip-note{color:var(--accent)} .chip-expense{color:var(--expense)} .chip-income{color:var(--income)}
.chip-swap{color:var(--muted);font-weight:400;font-size:12px}
.chip.static{cursor:default}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.mini-select{min-height:36px;padding:4px 30px 4px 12px;border-radius:0;border:1px solid var(--border);background:var(--surface-2);font-size:14px;cursor:pointer}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 18px;border-radius:0;border:1px solid transparent;font-weight:600;font-size:15px;cursor:pointer;min-height:44px;touch-action:manipulation;transition:background-color .15s,border-color .15s,opacity .15s,transform .1s;text-decoration:none;white-space:nowrap}
.btn:active:not(:disabled){transform:scale(.97)}
.btn .ic{width:18px;height:18px}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.primary:hover:not(:disabled){background:var(--accent-hover)}
.btn.secondary{background:var(--surface);border-color:var(--border-strong);color:var(--text)}
.btn.secondary:hover:not(:disabled){background:var(--surface-2)}
.btn.ghost{background:transparent;color:var(--text)}
.btn.ghost:hover{background:var(--surface-2)}
.btn.danger{background:var(--danger);color:#fff}
.btn.danger-ghost{background:transparent;color:var(--danger)}
.btn.danger-ghost:hover{background:var(--danger-soft)}
.btn.small{min-height:36px;padding:6px 12px;font-size:14px;border-radius:0}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.loading{opacity:.7;pointer-events:none}
.icon-btn{width:40px;height:40px;display:grid;place-items:center;border-radius:0;border:0;background:transparent;color:var(--muted);cursor:pointer;flex:none;transition:background-color .15s,color .15s}
.icon-btn:hover{background:var(--surface-2);color:var(--text)}

/* Stats */
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.stats.four{grid-template-columns:repeat(4,minmax(0,1fr))}
.stat{padding:14px 16px;min-width:0}
.stat-label{font-size:13px;color:var(--muted);font-weight:500}
.stat-value{font-family:var(--font-display);font-size:24px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.02em;margin-top:2px;overflow-wrap:anywhere;line-height:1.25}
.stat-value.neg{color:var(--danger)}
.stat-sub{font-size:13px;color:var(--muted);margin-top:2px}

/* Lists */
.list{list-style:none;margin:0;padding:0}
.list.card{overflow:hidden}
.list.card>li+li{border-top:1px solid var(--border)}
.entry{width:100%;display:flex;gap:12px;align-items:flex-start;text-align:left;padding:13px 16px;background:transparent;border:0;cursor:pointer;min-height:56px;transition:background-color .15s}
.entry:hover{background:var(--surface-2)}
.entry-ic{width:32px;height:32px;border-radius:0;display:grid;place-items:center;flex:none;margin-top:1px}
.entry-ic .ic{width:17px;height:17px}
.t-note{color:var(--accent);background:var(--accent-soft)}
.t-expense{color:var(--expense);background:var(--expense-soft)}
.t-income{color:var(--income);background:var(--income-soft)}
.t-save{color:var(--accent);background:var(--accent-soft)}
.chip-save{color:var(--accent)}
.goal-row{display:flex;align-items:center;padding-right:8px}
.goal-row .cat-row{flex:1;min-width:0}
.meter.done>span{background:var(--income)}
.cat-status.done{color:var(--income);font-weight:500}
.entry-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.entry-text{white-space:pre-wrap;overflow-wrap:anywhere}
.entry-meta{font-size:13px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.entry-meta .ic{width:13px;height:13px}
.dot{width:8px;height:8px;border-radius:0;display:inline-block;flex:none}
.amt{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.amt.out{color:var(--expense)} .amt.in{color:var(--income)} .amt.sv{color:var(--text)}
.empty{padding:28px 20px;text-align:center;color:var(--muted)}
.empty strong{display:block;color:var(--text);font-weight:600;margin-bottom:4px}
.empty .btn{margin-top:12px}

.banner{display:flex;gap:12px;align-items:center;padding:14px 16px;border-radius:0;background:var(--warn-soft);margin-bottom:20px;flex-wrap:wrap}
.banner>.ic{color:var(--warn)}
.banner p{margin:0;flex:1;min-width:200px;font-size:15px}
.banner.info{background:var(--accent-soft)}
.banner.info>.ic{color:var(--accent)}

/* Timeline */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.search{flex:1;min-width:200px;position:relative}
.search input{width:100%;padding:10px 12px 10px 40px;border-radius:0;border:1px solid var(--border-strong);background:var(--surface);min-height:44px}
.search .ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.seg{display:inline-flex;background:var(--surface-2);border-radius:0;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:7px 14px;border-radius:0;font-weight:500;font-size:14px;cursor:pointer;color:var(--muted);min-height:38px;transition:background-color .15s,color .15s}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:20px}
.tags .chip{min-height:32px;padding:3px 11px;font-size:13px;color:var(--muted)}
.day-group{margin-bottom:22px}

/* Notes */
.note-grid{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.note-tile{width:100%;height:100%;min-height:112px;display:flex;flex-direction:column;justify-content:space-between;gap:14px;text-align:left;padding:16px;background:var(--surface);border:1px solid var(--border);cursor:pointer;transition:border-color .15s}
.note-tile:hover{border-color:var(--text)}
.note-text{white-space:pre-wrap;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:8;-webkit-box-orient:vertical;overflow:hidden}
.capture .cap-bar.end{justify-content:flex-end}

/* Budget */
.month-nav{display:flex;align-items:center;gap:2px;background:var(--surface);border:1px solid var(--border);border-radius:0;padding:2px}
.month-nav .label{min-width:140px;text-align:center;font-weight:600;font-size:15px;background:none;border:0;cursor:pointer;min-height:40px;border-radius:0}
.cat-row{width:100%;display:block;text-align:left;padding:14px 16px;background:transparent;border:0;cursor:pointer;transition:background-color .15s}
.cat-row:hover{background:var(--surface-2)}
.cat-top{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.cat-name{display:flex;align-items:center;gap:8px;font-weight:600}
.cat-nums{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums;text-align:right}
.cat-nums strong{color:var(--text);font-weight:600}
.meter{height:8px;background:var(--surface-2);border-radius:0;margin-top:10px;overflow:hidden}
.meter>span{display:block;height:100%;border-radius:0;background:var(--accent);transition:width .4s ease-out}
.meter.warn>span{background:var(--warn)}
.meter.over>span{background:var(--danger)}
.cat-status{font-size:13px;margin-top:6px;color:var(--muted);display:flex;gap:6px;align-items:center}
.cat-status .ic{width:14px;height:14px}
.cat-status.over{color:var(--danger);font-weight:500}
.cat-status.warn{color:var(--warn);font-weight:500}
.chart{padding:16px 16px 12px}
.chart svg{display:block;width:100%;height:100px}
.chart .b{fill:var(--accent);opacity:.55}
.chart .b.today{opacity:1}
.chart .base{stroke:var(--border-strong);stroke-width:1}
.chart-axis{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:6px;font-variant-numeric:tabular-nums}
.chart-sum{font-size:14px;color:var(--muted);margin:0 0 10px}

/* Subscriptions */
.sub-row{display:flex;align-items:center;gap:12px;padding:12px 12px 12px 16px;flex-wrap:wrap}
.sub-main{flex:1;min-width:150px;display:flex;flex-direction:column}
.sub-name{font-weight:600;overflow-wrap:anywhere}
.sub-meta{font-size:13px;color:var(--muted)}
.is-overdue .when{color:var(--danger);font-weight:600}
.is-soon .when{color:var(--warn);font-weight:600}
.row-actions{display:flex;gap:4px;align-items:center;margin-left:auto}
details.more{margin-top:14px}
details.more summary{cursor:pointer;color:var(--muted);font-weight:500;font-size:14px;padding:8px 0;list-style-position:inside}

/* Settings */
.set-card{padding:20px;margin-bottom:16px}
.set-card>p{color:var(--muted);font-size:15px}
.step{display:flex;gap:14px;align-items:flex-start;padding:14px 0;border-top:1px solid var(--border)}
.step:first-of-type{margin-top:6px}
.step-num{width:28px;height:28px;border-radius:0;display:grid;place-items:center;background:var(--surface-2);font-weight:600;font-size:14px;flex:none}
.step-num .ic{width:16px;height:16px}
.step.done .step-num{background:var(--income-soft);color:var(--income)}
.step-body{flex:1;min-width:0}
.step-body p{font-size:14px;color:var(--muted);margin:2px 0 10px}
.status-line{display:flex;align-items:center;gap:8px;font-size:14px;padding:12px 14px;border-radius:0;background:var(--surface-2);margin:6px 0 14px}
.status-line .ic{width:18px;height:18px}
.status-line.ok{background:var(--income-soft);color:var(--income)}
.status-line.warn{background:var(--warn-soft);color:var(--warn)}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}
.pref{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:12px 0;border-top:1px solid var(--border);flex-wrap:wrap}
.pref:first-of-type{border-top:0}
.pref label,.pref .pref-label{font-weight:500}
.select{min-height:44px;padding:8px 12px;border-radius:0;border:1px solid var(--border-strong);background:var(--surface);cursor:pointer}
.danger-zone{border-color:var(--danger-soft)}

/* Forms & dialog */
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;min-width:0}
.field>span{font-size:14px;font-weight:500}
.field input,.field select,.field textarea{width:100%;padding:10px 12px;border-radius:0;border:1px solid var(--border-strong);background:var(--bg);min-height:44px}
.field textarea{resize:vertical;line-height:1.5}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent)}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.help{font-size:13px;color:var(--muted);margin:-6px 0 14px}
.check{display:flex;align-items:center;gap:10px;font-weight:500;margin-bottom:12px;cursor:pointer;min-height:36px}
.check input{width:18px;height:18px;accent-color:var(--accent)}
.type-seg{display:flex;gap:6px;margin:0 0 16px;padding:0;border:0}
.type-seg label{flex:1}
.type-seg input{position:absolute;opacity:0;pointer-events:none}
.type-seg span{display:flex;align-items:center;justify-content:center;gap:6px;padding:9px 10px;border-radius:0;border:1px solid var(--border-strong);font-weight:500;font-size:14px;cursor:pointer;min-height:44px;transition:background-color .15s,border-color .15s}
.type-seg input:checked+span{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.type-seg input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.type-seg .ic{width:16px;height:16px}
form[data-type="note"] .money-only{display:none}
form:not([data-type="expense"]) .expense-only{display:none}
.field-row.money-only.solo{grid-template-columns:1fr}
dialog{border:0;border-radius:0;padding:0;width:min(520px,calc(100vw - 32px));background:var(--surface);color:var(--text);box-shadow:0 24px 70px rgba(0,0,0,.28)}
dialog::backdrop{background:rgba(20,18,15,.45);backdrop-filter:blur(3px)}
dialog[open]{animation:dlg-in .2s cubic-bezier(.2,.8,.2,1)}
@keyframes dlg-in{from{opacity:0;transform:translateY(10px) scale(.98)}}
.dlg-head{display:flex;justify-content:space-between;align-items:center;padding:18px 16px 4px 22px}
.dlg-head h2{font-family:var(--font-display);text-transform:none;letter-spacing:-.02em;font-size:19px;color:var(--text);margin:0;font-weight:600}
.dlg-body{padding:12px 22px 4px;max-height:65vh;overflow:auto}
.dlg-body>p{color:var(--muted);font-size:15px}
.dlg-foot{display:flex;gap:8px;align-items:center;padding:14px 22px 18px;border-top:1px solid var(--border);flex-wrap:wrap}
.spacer{flex:1}
.dlg-err{color:var(--danger);font-size:14px;margin:0 0 10px;font-weight:500}
.dlg-err:empty{display:none}
.note-box{display:flex;gap:10px;padding:12px 14px;border-radius:0;background:var(--warn-soft);font-size:14px;margin-bottom:14px}
.note-box .ic{color:var(--warn);width:18px;height:18px;margin-top:2px}

.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,16px);opacity:0;pointer-events:none;background:var(--text);color:var(--bg);padding:8px 10px 8px 16px;border-radius:0;display:flex;gap:10px;align-items:center;z-index:100;transition:opacity .2s,transform .2s;max-width:calc(100vw - 32px);box-shadow:0 10px 30px rgba(0,0,0,.25);font-size:15px;min-height:44px}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast-btn{background:transparent;border:0;color:inherit;font-weight:700;text-decoration:underline;cursor:pointer;min-height:36px;padding:0 8px}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}

@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;inset:auto 0 0 0;height:auto;flex-direction:row;padding:4px 6px calc(4px + env(safe-area-inset-bottom));border-right:0;border-top:1px solid var(--border);background:var(--surface);z-index:40;gap:0}
  .side-foot{display:none}
  .nav{flex-direction:row;width:100%;justify-content:space-around}
  .nav li{flex:1}
  .nav a{flex-direction:column;gap:2px;font-size:12px;padding:6px 2px;justify-content:center;min-height:54px}
  .nav a[aria-current="page"]{background:transparent}
  .nav a[aria-current="page"] .ic{background:var(--accent-soft);border-radius:0;width:44px;padding:3px 12px;height:26px}
  .lbl-long{display:none} .lbl-short{display:inline}
  .mobile-top{display:flex;justify-content:flex-end;align-items:center;padding:12px 12px 0 16px;gap:4px}
  .nav-settings,.nav-timeline{display:none}
  main{padding:18px 16px calc(100px + env(safe-area-inset-bottom))}
  .toast{bottom:calc(86px + env(safe-area-inset-bottom))}
  .stats.four{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:560px){
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .stats>.stat:nth-child(3):last-child{grid-column:1/-1}

  .field-row{grid-template-columns:1fr}
  .note-grid{grid-template-columns:1fr}
  .month-nav .label{min-width:120px}
}

<script>
'use strict';
const STORE_KEY = 'daybook.v1';
const KDF_ITERATIONS = 310000;
const KEEP_DAILY = 7;
// Google Drive sync. The client ID is public by design (it only names the app to Google).
const GOOGLE_CLIENT_ID = '66067900001-el8jii4c2qog07a7rcij1dc1jh4l8a8f.apps.googleusercontent.com';
const DRIVE_SCOPE = 'https://www.googleapis.com/auth/drive.appdata';
const SYNC_FILE = 'daybook-sync.json';
const SYNCED = ['entries', 'subs', 'categories', 'goals'];
const KNOWN_KEYS = new Set(['v', 'settings', 'categories', 'entries', 'subs', 'goals', 'deleted']);
const SAVE_WORD = /^(save|saved|saving|savings)$/i;
const CURRENCIES = ['USD','EUR','GBP','AED','SAR','QAR','KWD','BHD','OMR','EGP','JOD','TRY','INR','PKR','CAD','AUD','CHF','JPY'];
const CAT_COLORS = ['#C2410C','#0F766E','#7C3AED','#B45309','#BE185D','#15803D','#2563EB','#9333EA','#64748B','#0E7490','#A16207'];
const DEFAULT_CATS = [['food','Food'],['transport','Transport'],['housing','Housing'],['bills','Bills'],['shopping','Shopping'],['health','Health'],['fun','Fun'],['subscriptions','Subscriptions'],['other','Other']];
const KEYWORDS = {
  food: 'coffee cafe café lunch dinner breakfast brunch grocery groceries restaurant food snack snacks pizza burger shawarma tea bakery supermarket starbucks mcdonalds kfc talabat deliveroo uber-eats careem-food juice dessert',
  transport: 'taxi uber careem fuel petrol gas parking bus metro train toll salik car tram flight-taxi',
  housing: 'rent mortgage furniture maintenance repair cleaning',
  bills: 'electricity water internet phone mobile wifi bill bills dewa etisalat du utility utilities insurance',
  shopping: 'clothes shoes amazon noon shopping gift gifts mall shirt jacket electronics',
  health: 'pharmacy doctor gym medicine dentist clinic hospital vitamins',
  fun: 'movie movies cinema game games concert trip travel hotel flight tickets party',
  subscriptions: 'netflix spotify youtube icloud subscription disney chatgpt claude prime shahid osn',
};
const INCOME_RE = /\b(salary|income|refund|bonus|paid me|freelance|dividend|cashback|payment received|got paid|wage|wages)\b/i;
const CYCLES = { weekly:'Weekly', monthly:'Monthly', quarterly:'Every 3 months', yearly:'Yearly' };
const PER_MONTH = { weekly:52/12, monthly:1, quarterly:1/3, yearly:1/12 };

/* ---------- helpers ---------- */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const icon = (name, cls = '') => `<svg class="ic ${cls}" aria-hidden="true"><use href="#i-${name}"/></svg>`;
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseYmd = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const startOfDay = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
const daysUntil = s => Math.round((parseYmd(s) - startOfDay(new Date())) / 864e5);
const sameDay = (a, b) => ymd(new Date(a)) === ymd(new Date(b));
const byTsDesc = (a, b) => b.ts - a.ts;
const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;
const shortDate = s => parseYmd(s).toLocaleDateString(undefined, { day:'numeric', month:'short' });
const timeOf = ts => new Date(ts).toLocaleTimeString(undefined, { hour:'2-digit', minute:'2-digit' });
const monthName = (y, m) => new Date(y, m, 1).toLocaleDateString(undefined, { month:'long', year:'numeric' });
function dayLabel(ts) {
  const d = new Date(ts), now = new Date(), y = new Date(now); y.setDate(now.getDate() - 1);
  if (sameDay(d, now)) return 'Today';
  if (sameDay(d, y)) return 'Yesterday';
  return d.toLocaleDateString(undefined, { weekday:'short', day:'numeric', month:'short', ...(d.getFullYear() !== now.getFullYear() && { year:'numeric' }) });
}
function ago(ts) {
  const s = (Date.now() - ts) / 1000;
  if (s < 60) return 'just now';
  if (s < 3600) return `${Math.floor(s / 60)} min ago`;
  if (s < 86400) return `${Math.floor(s / 3600)} h ago`;
  return plural(Math.floor(s / 86400), 'day') + ' ago';
}
function lsGet(k) { try { return localStorage.getItem(k); } catch { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); return true; } catch { return false; } }

let nf = null, nfCur = null;
function money(n) {
  const cur = state.settings.currency;
  if (nfCur !== cur) {
    try { nf = new Intl.NumberFormat(undefined, { style:'currency', currency:cur }); }
    catch { nf = new Intl.NumberFormat(undefined, { minimumFractionDigits:2, maximumFractionDigits:2 }); }
    nfCur = cur;
  }
  return nf.format(Math.round(n * 100) / 100);
}

/* ---------- state ---------- */
function freshState() {
  return {
    v: 1,
    settings: { currency:'USD', theme:'auto', welcomed:false },
    categories: DEFAULT_CATS.map(([id, name], i) => ({ id, name, budget:0, color:CAT_COLORS[i % CAT_COLORS.length] })),
    entries: [],
    subs: [],
    goals: [],
    deleted: {},
  };
}
function normalize(s) {
  const f = freshState();
  if (!s || typeof s !== 'object') return f;
  const out = {
    v: 1,
    settings: { ...f.settings, ...(s.settings || {}) },
    categories: Array.isArray(s.categories) && s.categories.length ? s.categories : f.categories,
    entries: Array.isArray(s.entries) ? s.entries.filter(e => e && e.id && e.type) : [],
    subs: Array.isArray(s.subs) ? s.subs.filter(x => x && x.id) : [],
    goals: Array.isArray(s.goals) ? s.goals.filter(x => x && x.id) : [],
    deleted: s.deleted && typeof s.deleted === 'object' ? s.deleted : {},
  };
  // Keep data written by newer versions so an older device never drops it while syncing.
  for (const k of Object.keys(s)) if (!KNOWN_KEYS.has(k)) out[k] = s[k];
  if (!out.categories.some(c => c.id === 'other')) out.categories.push({ id:'other', name:'Other', budget:0, color:'#64748B' });
  return out;
}
let state;
try { state = normalize(JSON.parse(localStorage.getItem(STORE_KEY))); }
catch { state = freshState(); }

// Change tracking for sync: every save stamps changed items with `u` (updated ms)
// and records removed ones in `state.deleted`, so two devices can be merged safely.
function snapshotOf(s) {
  const m = new Map();
  for (const k of SYNCED) for (const x of s[k]) { const { u, ...rest } = x; m.set(k + ':' + x.id, JSON.stringify(rest)); }
  const { u, ...set } = s.settings;
  m.set('settings', JSON.stringify(set));
  return m;
}
let snap = snapshotOf(state);
function stamp() {
  const now = Date.now(), next = snapshotOf(state);
  for (const k of SYNCED) for (const x of state[k]) {
    const key = k + ':' + x.id;
    if (snap.get(key) !== next.get(key)) { x.u = now; delete state.deleted[key]; }
  }
  if (snap.get('settings') !== next.get('settings')) state.settings.u = now;
  for (const key of snap.keys()) if (key !== 'settings' && !next.has(key)) state.deleted[key] = now;
  for (const [key, t] of Object.entries(state.deleted)) if (now - t > 180 * 864e5) delete state.deleted[key];
  snap = next;
}
function mergeStates(a, b) {
  const deleted = { ...a.deleted };
  for (const [k, t] of Object.entries(b.deleted)) deleted[k] = Math.max(deleted[k] || 0, t);
  const out = { v:1, settings: (b.settings.u || 0) > (a.settings.u || 0) ? b.settings : a.settings, deleted };
  for (const k of SYNCED) {
    // Remote order first and a fixed sort, so every device converges on identical data.
    const m = new Map();
    for (const x of b[k]) m.set(x.id, x);
    for (const x of a[k]) { const cur = m.get(x.id); if (!cur || (x.u || 0) > (cur.u || 0)) m.set(x.id, x); }
    out[k] = [...m.values()].filter(x => { const t = deleted[k + ':' + x.id]; return !(t && t >= (x.u || 0)); });
    if (k !== 'categories') out[k].sort((x, y) => (x.ts || 0) - (y.ts || 0) || (x.id < y.id ? -1 : 1));
  }
  return normalize(out);
}

function save() {
  stamp();
  if (!lsSet(STORE_KEY, JSON.stringify(state))) toast("Couldn't save in this browser. Download a backup from Settings now.");
  Backup.schedule();
  Sync.schedule();
  render();
}
function applyMerged(m) {
  state = m;
  lsSet(STORE_KEY, JSON.stringify(state));
  snap = snapshotOf(state);
  applyTheme();
  render();
  Backup.schedule();
}
const goalById = id => state.goals.find(g => g.id === id);
const catById = id => state.categories.find(c => c.id === id) || state.categories.find(c => c.id === 'other');
const subById = id => state.subs.find(s => s.id === id);

/* ---------- quick capture parsing ---------- */
const TAG_RE = /#([\p{L}\p{N}_-]+)/gu;
function amountOf(w) {
  const m = w.match(/^([+-])?(?:[$€£¥₹]|aed|usd|eur|gbp|sar|qar|kwd)?([+-])?(\d{1,3}(?:,\d{3})+|\d+)(?:\.(\d{1,2}))?(k)?$/i);
  if (!m) return null;
  const value = parseFloat(m[3].replace(/,/g, '') + (m[4] ? '.' + m[4] : '')) * (m[5] ? 1000 : 1);
  return { sign: m[1] || m[2] || null, value };
}
function guessCat(lower, tags) {
  for (const t of tags) { const c = state.categories.find(c => c.name.toLowerCase() === t || c.id === t); if (c) return c.id; }
  const words = lower.split(/[^\p{L}\p{N}-]+/u);
  for (const [id, list] of Object.entries(KEYWORDS)) {
    if (!state.categories.some(c => c.id === id)) continue;
    const set = list.split(' ');
    if (words.some(w => set.includes(w))) return id;
  }
  return 'other';
}
function analyze(raw) {
  const text = raw.trim();
  const tags = [...new Set([...text.matchAll(TAG_RE)].map(m => m[1].toLowerCase()))];
  const words = text.split(/\s+/).filter(Boolean);
  const plain = words.map((w, i) => [w, i]).filter(([w]) => !w.startsWith('#'));
  let hit = null;
  const saveIntent = SAVE_WORD.test(plain[0]?.[0] || '');
  // "save 500 car": the amount can follow the word "save".
  for (const pos of saveIntent ? [1, plain.length - 1] : [plain.length - 1, 0]) {
    const it = plain[pos]; if (!it) continue;
    const a = amountOf(it[0]);
    // "meeting at 3", "chapter 12", "page 40" are notes, not money.
    const before = (words[it[1] - 1] || '').toLowerCase();
    if (a && !a.sign && /^(at|by|on|until|till|around|chapter|page|pages|day|week|room|floor|step|level|part|no\.?|number)$/.test(before)) continue;
    if (a) { hit = { ...a, i: it[1] }; break; }
  }
  const rest = words.filter((w, i) => (!hit || i !== hit.i) && !w.startsWith('#')).join(' ');
  const lower = rest.toLowerCase();
  const isMoney = !!hit && hit.value > 0 && words.length <= 10;
  const guessType = saveIntent && state.goals.length && !hit?.sign ? 'save'
    : hit?.sign === '+' ? 'income' : hit?.sign === '-' ? 'expense' : INCOME_RE.test(lower) ? 'income' : 'expense';
  return { text, tags, amount: hit ? hit.value : null, rest, lower, isMoney, guessType };
}
function guessGoal(lower, tags) {
  const norm = s => s.toLowerCase().replace(/[^\p{L}\p{N}]/gu, '');
  for (const t of tags) { const g = state.goals.find(g => norm(g.name).startsWith(norm(t))); if (g) return g.id; }
  const words = lower.split(/\s+/).filter(w => w.length > 2 && !SAVE_WORD.test(w) && !/^(for|the|into|towards?)$/.test(w));
  const g = state.goals.find(g => words.some(w => g.name.toLowerCase().includes(w)));
  return (g || state.goals[0])?.id || null;
}

/* ---------- capture state ---------- */
let draft = '', capType = null, capCat = null, capGoal = null;
function preview() {
  const t = draft.trim(); if (!t) return null;
  const a = analyze(t);
  const type = capType || (a.isMoney ? a.guessType : 'note');
  if (type === 'note') return { type, text: t, tags: a.tags };
  if (type === 'save') { const goal = capGoal || guessGoal(a.lower, a.tags); return { type, text: goalById(goal)?.name || 'Savings', amount: a.amount, goal, tags: a.tags }; }
  const label = a.amount != null ? (a.rest || (type === 'income' ? 'Income' : 'Expense')) : t.replace(TAG_RE, '').trim();
  return { type, text: label, amount: a.amount, cat: type === 'expense' ? (capCat || guessCat(a.lower, a.tags)) : null, tags: a.tags };
}
const TYPE_META = { note:['note','Note'], expense:['out','Expense'], income:['in','Income'], save:['save','Saving'] };
const goalOptions = sel => state.goals.map(g => `<option value="${esc(g.id)}"${g.id === sel ? ' selected' : ''}>${esc(g.name)}</option>`).join('');
const signed = (n, plus = true) => (n < 0 ? '−' : plus ? '+' : '') + money(Math.abs(n));
function previewHTML(p) {
  if (!p) return '';
  const [ic, label] = TYPE_META[p.type];
  let h = `<button type="button" class="chip chip-${p.type}" data-act="cap-type" aria-label="Saving as ${label}. Change type">${icon(ic)}${label}<span class="chip-swap" aria-hidden="true">· change</span></button>`;
  if (p.type === 'expense') h += `<label class="sr-only" for="cap-cat">Category</label><select id="cap-cat" class="mini-select" data-change="cap-cat">${catOptions(p.cat)}</select>`;
  if (p.type === 'save') h += `<label class="sr-only" for="cap-goal">Goal</label><select id="cap-goal" class="mini-select" data-change="cap-goal">${goalOptions(p.goal)}</select>`;
  if (p.type !== 'note') h += p.amount > 0
    ? `<span class="cap-amt">${p.type === 'expense' ? '−' : '+'}${money(p.amount)}</span>`
    : `<span class="cap-amt missing">Add an amount, like “lunch 12”</span>`;
  return h;
}
function catOptions(sel) {
  return state.categories.map(c => `<option value="${esc(c.id)}"${c.id === sel ? ' selected' : ''}>${esc(c.name)}</option>`).join('');
}
function updatePreview() {
  const el = $('#cap-preview'); if (el) el.innerHTML = previewHTML(preview());
  const b = $('[data-act="cap-save"]'); if (b) b.disabled = !draft.trim();
}
function capSave() {
  const p = preview(); if (!p) return;
  if (p.type !== 'note' && !(p.amount > 0)) { toast('Add an amount first, like “lunch 12”.'); return; }
  const e = { id:uid(), type:p.type, text:p.text, amount:p.type === 'note' ? null : p.amount, cat:p.cat || null, tags:p.tags, ts:Date.now(), pinned:false };
  if (p.type === 'save') e.goal = p.goal;
  state.entries.push(e);
  draft = ''; capType = null; capCat = null; capGoal = null;
  save();
  const cap = $('#cap'); if (cap) cap.focus();
  toast(e.type === 'note' ? 'Note saved' : e.type === 'save' ? `Saved ${money(e.amount)} · ${e.text}` : `${e.type === 'income' ? 'Income' : 'Expense'} logged · ${money(e.amount)}`, {
    action:'Undo', onAction() { state.entries = state.entries.filter(x => x.id !== e.id); save(); },
  });
}

/* ---------- numbers ---------- */
function monthStats(y, m) {
  const start = new Date(y, m, 1).getTime(), end = new Date(y, m + 1, 1).getTime();
  const days = new Date(y, m + 1, 0).getDate();
  const byDay = new Array(days).fill(0), byCat = {};
  let spent = 0, income = 0;
  for (const e of state.entries) {
    if (e.ts < start || e.ts >= end) continue;
    if (e.type === 'expense') {
      const cid = catById(e.cat).id;
      spent += e.amount; byCat[cid] = (byCat[cid] || 0) + e.amount; byDay[new Date(e.ts).getDate() - 1] += e.amount;
    } else if (e.type === 'income') income += e.amount;
  }
  let budget = 0, budgetedSpent = 0;
  for (const c of state.categories) if (c.budget > 0) { budget += c.budget; budgetedSpent += byCat[c.id] || 0; }
  return { spent, income, byDay, byCat, budget, left: budget - budgetedSpent, days };
}
const activeSubs = () => state.subs.filter(s => s.status === 'active');
const subsMonthly = () => activeSubs().reduce((t, s) => t + s.amount * (PER_MONTH[s.cycle] || 1), 0);
const upcomingSubs = days => activeSubs().filter(s => daysUntil(s.next) <= days).sort((a, b) => a.next.localeCompare(b.next));
function nextDate(s) {
  const d = parseYmd(s.next);
  if (s.cycle === 'weekly') { d.setDate(d.getDate() + 7); return ymd(d); }
  const add = { monthly:1, quarterly:3, yearly:12 }[s.cycle] || 1;
  const anchor = s.day || d.getDate();
  const y = d.getFullYear(), m = d.getMonth() + add;
  return ymd(new Date(y, m, Math.min(anchor, new Date(y, m + 1, 0).getDate())));
}

/* ---------- shared fragments ---------- */
function entryItem(e, showDay) {
  const [ic] = TYPE_META[e.type];
  const meta = [];
  if (e.pinned) meta.push(`${icon('pin')}<span>Pinned</span>`);
  meta.push(`<span>${showDay ? dayLabel(e.ts) + ', ' : ''}${timeOf(e.ts)}</span>`);
  if (e.type === 'expense') { const c = catById(e.cat); meta.push(`<span class="dot" style="background:${esc(c.color)}" aria-hidden="true"></span><span>${esc(c.name)}</span>`); }
  if (e.type === 'save') meta.push('<span>Savings</span>');
  if (e.type !== 'note') for (const t of e.tags || []) meta.push(`<span>#${esc(t)}</span>`);
  const amt = e.type === 'note' ? ''
    : e.type === 'save' ? `<span class="amt sv">${signed(e.amount)}</span>`
    : `<span class="amt ${e.type === 'income' ? 'in' : 'out'}">${e.type === 'income' ? '+' : '−'}${money(e.amount)}</span>`;
  return `<li><button class="entry" data-act="edit" data-id="${e.id}">
    <span class="entry-ic t-${e.type}">${icon(ic)}</span>
    <span class="entry-main"><span class="entry-text">${esc(e.text)}</span><span class="entry-meta">${meta.join('<span aria-hidden="true">·</span>')}</span></span>
    ${amt}</button></li>`;
}
function subRow(s) {
  const d = daysUntil(s.next);
  const off = s.status !== 'active';
  const when = off ? (s.status === 'paused' ? 'Paused' : 'Cancelled')
    : d < 0 ? `Overdue by ${plural(-d, 'day')}` : d === 0 ? 'Due today' : d === 1 ? 'Due tomorrow' : `Renews in ${d} days`;
  const cls = off ? '' : d < 0 ? 'is-overdue' : d <= 3 ? 'is-soon' : '';
  return `<li class="sub-row ${cls}">
    <div class="sub-main"><span class="sub-name">${esc(s.name)}</span>
      <span class="sub-meta"><span class="when">${when}</span>${off ? '' : ' · ' + shortDate(s.next)} · ${CYCLES[s.cycle] || s.cycle}</span></div>
    <span class="amt">${money(s.amount)}</span>
    <div class="row-actions">
      ${off ? '' : `<button class="btn small secondary" data-act="sub-paid" data-id="${s.id}">${icon('check')}Paid</button>`}
      <button class="icon-btn" data-act="sub-edit" data-id="${s.id}" aria-label="Edit ${esc(s.name)}">${icon('edit')}</button>
    </div></li>`;
}
function stat(label, value, sub, neg) {
  return `<div class="card stat"><div class="stat-label">${label}</div><div class="stat-value${neg ? ' neg' : ''}">${value}</div>${sub ? `<div class="stat-sub">${sub}</div>` : ''}</div>`;
}

/* ---------- views ---------- */
function vToday() {
  const now = new Date();

  const pinned = state.entries.filter(e => e.pinned && !sameDay(e.ts, now)).sort(byTsDesc);

}

let nt = { q:'', tag:null }, noteDraft = '';

function noteTile(e) {

function noteSave() {

let tl = { q:'', filter:'all', tag:null, limit:150 };
function vTimeline() {
  const q = tl.q.trim().toLowerCase();

  const total = list.length;

  const groups = [];
  for (const e of shown) { const k = ymd(new Date(e.ts)); const g = groups[groups.length - 1]; if (g && g.k === k) g.items.push(e); else groups.push({ k, items:[e] }); }

let bm = { y: new Date().getFullYear(), m: new Date().getMonth() };
function vBudget() {
  const { y, m } = bm;
  const st = monthStats(y, m);
  const now = new Date(), isNow = y === now.getFullYear() && m === now.getMonth();
  const net = st.income - st.spent;
  const cats = state.categories.map(c => ({ c, spent: st.byCat[c.id] || 0 }))
    .sort((a, b) => (b.c.budget > 0) - (a.c.budget > 0) || b.spent - a.spent);
  return `
  <header class="page-head"><h1 tabindex="-1">${monthName(y, m)}</h1>

      <button class="label" data-act="month-now" ${isNow ? 'disabled' : ''} aria-label="${isNow ? 'This month' : 'Back to this month'}">${isNow ? 'This month' : 'Back to today'}</button>
      <button class="icon-btn" data-act="month-next" aria-label="Next month">${icon('chev-r')}</button></div>

function catRow(c, spent) {
  let nums, status = '', meter = '';
  if (c.budget > 0) {
    const pct = spent / c.budget * 100, left = c.budget - spent;
    const cls = pct > 100 ? 'over' : pct >= 80 ? 'warn' : '';
    nums = `<strong>${money(spent)}</strong> of ${money(c.budget)}`;
    meter = `<div class="meter ${cls}" role="progressbar" aria-label="${esc(c.name)} budget used" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.round(Math.min(pct, 100))}"><span style="width:${Math.min(pct, 100)}%"></span></div>`;
    status = `<div class="cat-status ${cls}">${cls ? icon('alert') : ''}${pct > 100 ? `Over by ${money(-left)}` : `${money(left)} left`}</div>`;
  } else {
    nums = `<strong>${money(spent)}</strong>`;
  }
  return `<li><button class="cat-row" data-act="cat-edit" data-id="${esc(c.id)}">
    <div class="cat-top"><span class="cat-name"><span class="dot" style="background:${esc(c.color)}" aria-hidden="true"></span>${esc(c.name)}</span><span class="cat-nums">${nums}</span></div>
    ${meter}${status}</button></li>`;
}
function dayChart(st, y, m) {
  const max = Math.max(...st.byDay);
  if (!max) return `<p class="muted" style="margin:6px 0">No spending yet</p>`;
  const n = st.days, W = n * 12, H = 100;
  const now = new Date(), isNow = y === now.getFullYear() && m === now.getMonth();
  const peak = st.byDay.indexOf(max);
  const bars = st.byDay.map((v, i) => {
    if (!v) return '';
    const h = Math.max(3, v / max * (H - 8));
    const label = new Date(y, m, i + 1).toLocaleDateString(undefined, { day:'numeric', month:'short' });
    return `<rect class="b${isNow && i === now.getDate() - 1 ? ' today' : ''}" x="${i * 12 + 2}" y="${H - h}" width="8" height="${h}"><title>${label}: ${money(v)}</title></rect>`;
  }).join('');
  const peakLabel = new Date(y, m, peak + 1).toLocaleDateString(undefined, { day:'numeric', month:'short' });
  return `<p class="chart-sum">Peak <strong style="color:var(--text)">${peakLabel} · ${money(max)}</strong></p>
    <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Daily spending in ${monthName(y, m)}. Biggest day ${peakLabel} at ${money(max)}.">
      ${bars}<line class="base" x1="0" y1="${H - 0.5}" x2="${W}" y2="${H - 0.5}" vector-effect="non-scaling-stroke"/></svg>
    <div class="chart-axis" aria-hidden="true"><span>1</span><span>8</span><span>15</span><span>22</span><span>${n}</span></div>`;
}

function vSubs() {

function vSavings() {
  const now = new Date(), monthStart = new Date(now.getFullYear(), now.getMonth(), 1).getTime();
  const savedBy = {};
  let total = 0, month = 0;
  for (const e of state.entries) if (e.type === 'save') {
    savedBy[e.goal] = (savedBy[e.goal] || 0) + e.amount;
    total += e.amount;
    if (e.ts >= monthStart) month += e.amount;
  }
  const goals = [...state.goals].sort((a, b) => (a.ts || 0) - (b.ts || 0));
  const toGo = goals.reduce((t, g) => t + Math.max(0, (g.target || 0) - (savedBy[g.id] || 0)), 0);
  const recent = state.entries.filter(e => e.type === 'save').sort(byTsDesc).slice(0, 8);
  return `
  <header class="page-head"><h1 tabindex="-1">Savings</h1>
    <button class="btn primary" data-act="goal-add">${icon('plus')}Goal</button></header>
  <section class="stats" aria-label="Totals">
    ${stat('Saved', money(total))}
    ${stat('This month', signed(month, false), '', month < 0)}
    ${stat('To go', money(toGo))}
  </section>
  <section><h2>Goals</h2>
    ${goals.length ? `<ul class="list card">${goals.map(g => goalRow(g, savedBy[g.id] || 0)).join('')}</ul>`
      : `<div class="card empty">No goals yet</div>`}
  </section>
  ${recent.length ? `<section><h2>Recent</h2><ul class="list card">${recent.map(e => entryItem(e, true)).join('')}</ul></section>` : ''}`;
}
function goalRow(g, saved) {
  const pct = g.target > 0 ? saved / g.target * 100 : 0;
  const done = g.target > 0 && saved >= g.target;
  const left = (g.target || 0) - saved;
  let status = '';
  if (done) status = `<div class="cat-status done">${icon('check')}Reached</div>`;
  else if (g.target > 0 && g.date) {
    const days = daysUntil(g.date);
    const dateTxt = parseYmd(g.date).toLocaleDateString(undefined, { month:'short', year:'numeric' });
    status = days < 0
      ? `<div class="cat-status warn">${icon('alert')}${money(left)} to go · was due ${dateTxt}</div>`
      : `<div class="cat-status">${money(left / Math.max(1, Math.ceil(days / 30.44)))} / month to reach it by ${dateTxt}</div>`;

function backupBody() {
  const B = Backup;
  if (!window.crypto?.subtle) return `<div class="note-box">${icon('alert')}<span>Open in Edge or Chrome to enable backups.</span></div>`;
  const pwDone = !!B.key, folderDone = !!B.handle;
  let status = '';
  if (B.status === 'ready') status = `<div class="status-line ok">${icon('cloud')}${B.lastAt ? `Backed up ${ago(B.lastAt)}` : 'On'}</div>`;
  else if (B.status === 'needs-permission') status = `<div class="status-line warn">${icon('alert')}<span style="flex:1">Permission needed</span><button class="btn small primary" data-act="bk-reconnect">Allow</button></div>`;
  else if (B.status === 'error') status = `<div class="status-line warn">${icon('alert')}<span style="flex:1">Last backup failed: ${esc(B.error)}</span></div>`;
  const folderStep = B.supported
    ? `<div class="step ${folderDone ? 'done' : ''}"><span class="step-num">${folderDone ? icon('check') : '2'}</span><div class="step-body">
        <strong>Folder</strong>
        <p>${folderDone ? esc(B.handle.name) : 'Pick one inside Google Drive'}</p>
        <button class="btn ${folderDone ? 'secondary small' : 'primary'}" data-act="bk-folder" ${pwDone ? '' : 'disabled'}>${icon('folder')}${folderDone ? 'Change folder' : 'Choose folder'}</button>
      </div></div>`
    : Sync.st.on ? '' : `<div class="note-box">${icon('alert')}<span>Auto backups need Edge or Chrome. Use Download instead.</span></div>`;
  return `${status}
    <div class="step ${pwDone ? 'done' : ''}"><span class="step-num">${pwDone ? icon('check') : '1'}</span><div class="step-body">
      <strong>Password</strong>
      <p>${pwDone ? 'Encrypted' : "Write it down. It can't be recovered."}</p>
      <button class="btn ${pwDone ? 'secondary small' : 'primary'}" data-act="bk-password">${icon('lock')}${pwDone ? 'Change password' : 'Set password'}</button>
    </div></div>
    ${folderStep}
    ${B.status === 'ready' ? `<div class="btn-row" style="margin-top:6px"><button class="btn secondary small" data-act="bk-now">${icon('cloud')}Back up now</button></div>` : ''}`;
}
function bannerHTML() {
  const B = Backup, S = Sync;
  if (S.st.on && S.enabled) {
    if (S.status === 'signin') return `<div class="banner">${icon('alert')}<p>Sync paused</p><button class="btn small primary" data-act="sync-signin">Sign in</button></div>`;
    if (S.status === 'locked') return `<div class="banner">${icon('lock')}<p>Enter your password to sync</p><button class="btn small primary" data-act="sync-unlock">Unlock</button></div>`;
    if (S.status === 'nokey') return `<div class="banner">${icon('lock')}<p>Set a password to sync</p><button class="btn small primary" data-act="sync-setpw">Set</button></div>`;
  }
  if (B.status === 'needs-permission') return `<div class="banner">${icon('alert')}<p>Backup paused</p><button class="btn small primary" data-act="bk-reconnect">Allow</button></div>`;
  if (B.status === 'error') return `<div class="banner">${icon('alert')}<p>Backup failed</p><a class="btn small secondary" href="#settings">Details</a></div>`;
  if (!S.st.on && (B.status === 'no-password' || B.status === 'no-folder' || B.status === 'manual') && state.entries.length + state.subs.length >= 3)
    return `<div class="banner info">${icon('cloud-off')}<p>Backups are off</p><a class="btn small primary" href="#settings">Set up</a></div>`;
  return '';
}

/* ---------- render & routing ---------- */
const VIEWS = { today:vToday, notes:vNotes, timeline:vTimeline, budget:vBudget, savings:vSavings, subs:vSubs, settings:vSettings };
let view = 'today';
const main = $('#main');
function render() {
  const ae = document.activeElement;
  const id = ae && main.contains(ae) ? ae.id : null;
  const sel = id && typeof ae.selectionStart === 'number' ? [ae.selectionStart, ae.selectionEnd] : null;
  main.innerHTML = VIEWS[view]();
  if (id) { const el = document.getElementById(id); if (el) { el.focus({ preventScroll:true }); if (sel) try { el.setSelectionRange(...sel); } catch {} } }
  for (const t of $$('#cap, #note-new')) autoGrow(t);
  renderChrome();
}
function renderChrome() {
  const B = Backup, S = Sync;
  let cls = '', ic = 'cloud-off', txt = 'Backups off';
  if (S.st.on && S.enabled) {
    const bad = { signin:'Sign in to sync', locked:'Password needed', nokey:'Set a password', error:'Sync failed' }[S.status];
    if (bad) { cls = 'warn'; ic = 'alert'; txt = bad; }
    else { cls = 'ok'; ic = 'cloud'; txt = S.status === 'syncing' ? 'Syncing…' : S.st.lastAt ? `Synced ${ago(S.st.lastAt)}` : 'Sync on'; }
  }
  else if (B.status === 'ready') { cls = 'ok'; ic = 'cloud'; txt = B.lastAt ? `Backed up ${ago(B.lastAt)}` : 'Backups on'; }
  else if (B.status === 'needs-permission' || B.status === 'error') { cls = 'warn'; ic = 'alert'; txt = B.status === 'error' ? 'Backup failed' : 'Reconnect backup'; }
  else if (B.status === 'manual') { txt = 'Manual backups'; }
  for (const p of $$('.backup-pill')) { p.className = 'backup-pill ' + cls; p.innerHTML = icon(ic) + `<span>${txt}</span>`; p.setAttribute('aria-label', `Backup status: ${txt}. Open settings`); }
  const b = $('#backup-banner'); if (b) b.innerHTML = bannerHTML();
}
function route(focus) {
  const h = location.hash.slice(1);
  view = VIEWS[h] ? h : 'today';
  for (const a of $$('.nav a')) { if (a.dataset.view === view) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); }
  render();
  window.scrollTo(0, 0);
  if (focus) $('#main h1')?.focus();
}
function autoGrow(el) { el.style.height = 'auto'; el.style.height = el.scrollHeight + 'px'; }
function applyTheme() {
  const t = state.settings.theme;
  if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme;
}

/* ---------- toast ---------- */
let toastTimer;
function toast(msg, opts = {}) {
  const t = $('#toast');
  t.innerHTML = `<span>${esc(msg)}</span>` + (opts.action ? `<button class="toast-btn">${esc(opts.action)}</button>` : '');
  t.classList.add('show');
  const hide = () => t.classList.remove('show');
  if (opts.action) t.querySelector('button').onclick = () => { opts.onAction(); hide(); };
  clearTimeout(toastTimer);
  toastTimer = setTimeout(hide, opts.action ? 6000 : 3500);
}

/* ---------- dialogs ---------- */
const dlg = $('#dlg');
function openDialog({ title, body, submit = 'Save', extra = '', onSubmit, submitClass = 'primary' }) {
  dlg.innerHTML = `<form method="dialog" novalidate>
    <header class="dlg-head"><h2 id="dlg-title">${title}</h2><button type="button" class="icon-btn" data-close aria-label="Close">${icon('x')}</button></header>
    <div class="dlg-body">${body}<p class="dlg-err" role="alert"></p></div>
    <footer class="dlg-foot">${extra}<span class="spacer"></span><button type="button" class="btn ghost" data-close>Cancel</button><button type="submit" class="btn ${submitClass}">${submit}</button></footer></form>`;
  const form = $('form', dlg);
  form.addEventListener('submit', async ev => {
    ev.preventDefault();
    const btn = $('button[type=submit]', form);
    btn.classList.add('loading');
    try { if (await onSubmit(new FormData(form), form) !== false) dlg.close(); }
    finally { btn.classList.remove('loading'); }
  });
  for (const b of $$('[data-close]', form)) b.onclick = () => dlg.close();
  dlg.showModal();
  $('.dlg-body input:not([type=radio]):not([type=checkbox]), .dlg-body textarea', form)?.focus();

}
const formErr = (form, msg) => { $('.dlg-err', form).textContent = msg; return false; };
const parseTags = s => [...new Set(String(s || '').split(/[\s,]+/).map(t => t.replace(/^#/, '').toLowerCase()).filter(Boolean))];

function editGoal(id) {
  const g = id ? goalById(id) : null;
  const form = openDialog({
    title: g ? 'Edit goal' : 'New goal',
    submit: g ? 'Save' : 'Add',
    body: `<label class="field"><span>Name</span><input name="name" value="${esc(g?.name || '')}" placeholder="Emergency fund, car, travel…" required autocomplete="off"></label>
      <div class="field-row"><label class="field"><span>Target (${esc(state.settings.currency)})</span><input name="target" type="number" step="1" min="0" inputmode="decimal" value="${g?.target || ''}" placeholder="Optional"></label>
        <label class="field"><span>By</span><input name="date" type="date" value="${g?.date || ''}"></label></div>
      ${g ? '' : `<label class="field"><span>Already saved</span><input name="start" type="number" step="0.01" min="0" inputmode="decimal" placeholder="0"></label>`}`,
    extra: g ? `<button type="button" class="btn danger-ghost" data-del>${icon('trash')}Delete</button>` : '',
    onSubmit(fd, form) {
      const name = String(fd.get('name')).trim(), target = parseFloat(fd.get('target')) || 0, date = fd.get('date') || null;
      if (!name) return formErr(form, 'Give it a name.');
      if (target < 0) return formErr(form, 'The target can’t be negative.');
      if (g) Object.assign(g, { name, target, date });
      else {
        const ng = { id:uid(), name, target, date, ts:Date.now() };
        state.goals.push(ng);
        const start = parseFloat(fd.get('start')) || 0;
        if (start > 0) state.entries.push({ id:uid(), type:'save', text:name, amount:start, goal:ng.id, tags:[], ts:Date.now(), pinned:false });
      }
      save(); toast(g ? 'Saved' : `${name} added`);
    },
  });
  const del = $('[data-del]', form);
  if (del) del.onclick = () => {
    if (!confirm(`Delete “${g.name}”? Its deposits stay in your Timeline.`)) return;
    const idx = state.goals.indexOf(g);
    state.goals.splice(idx, 1); dlg.close(); save();
    toast(`${g.name} deleted`, { action:'Undo', onAction() { state.goals.splice(idx, 0, g); save(); } });
  };
}
// Put money into a goal, take it out, or edit an existing saving entry.
function moveDialog(goalId, e) {
  if (!state.goals.length) { editGoal(); return; }
  const g = goalById(goalId) || state.goals[0];
  const out = e ? e.amount < 0 : false;
  const when = new Date(e ? e.ts : Date.now());
  const radio = (v, label, ic, on) => `<label><input type="radio" name="dir" value="${v}"${on ? ' checked' : ''}><span>${icon(ic)}${label}</span></label>`;
  const form = openDialog({
    title: e ? 'Edit saving' : esc(g.name),
    submit: 'Save',
    body: `<fieldset class="type-seg"><legend class="sr-only">Direction</legend>${radio('in', 'Put in', 'in', !out)}${radio('out', 'Take out', 'out', out)}</fieldset>
      <div class="field-row"><label class="field"><span>Amount (${esc(state.settings.currency)})</span><input name="amount" type="number" step="0.01" min="0" inputmode="decimal" value="${e ? Math.abs(e.amount) : ''}" required></label>
        <label class="field"><span>Goal</span><select name="goal">${goalOptions(g.id)}</select></label></div>
      <label class="field"><span>Date & time</span><input type="datetime-local" name="ts" value="${ymd(when)}T${pad(when.getHours())}:${pad(when.getMinutes())}" required></label>`,
    extra: e ? `<button type="button" class="btn danger-ghost" data-del>${icon('trash')}Delete</button>` : '',
    onSubmit(fd, form) {
      const amount = parseFloat(fd.get('amount')), ts = new Date(fd.get('ts')).getTime(), goal = fd.get('goal');
      if (!(amount > 0)) return formErr(form, 'Enter an amount above zero.');
      if (!Number.isFinite(ts)) return formErr(form, 'Pick a valid date and time.');
      const value = fd.get('dir') === 'out' ? -amount : amount, name = goalById(goal)?.name || 'Savings';
      if (e) Object.assign(e, { amount:value, goal, ts, text:name });
      else state.entries.push({ id:uid(), type:'save', text:name, amount:value, goal, tags:[], ts, pinned:false });
      save(); toast(`${value < 0 ? 'Took out' : 'Saved'} ${money(amount)} · ${name}`);
    },
  });
  const del = $('[data-del]', form);
  if (del) del.onclick = () => {
    const idx = state.entries.indexOf(e);
    state.entries.splice(idx, 1); dlg.close(); save();
    toast('Entry deleted', { action:'Undo', onAction() { state.entries.splice(idx, 0, e); save(); } });
  };
}

        <label class="field expense-only"><span>Category</span><select name="cat">${catOptions(catById(e.cat).id)}</select></label></div>

function subPaid(id) {

  const prev = s.next;

  s.next = nextDate(s);
  save();
  toast(`${s.name} logged · next on ${shortDate(s.next)}`, { action:'Undo', onAction() { state.entries = state.entries.filter(x => x.id !== e.id); s.next = prev; save(); } });

function editCat(id) {
  const c = id ? state.categories.find(x => x.id === id) : null;
  const form = openDialog({
    title: c ? esc(c.name) : 'New category',

    extra: c && c.id !== 'other' ? `<button type="button" class="btn danger-ghost" data-del>${icon('trash')}Delete</button>` : '',
    onSubmit(fd, form) {
      const name = String(fd.get('name')).trim(), budget = parseFloat(fd.get('budget')) || 0;
      if (!name) return formErr(form, 'Give it a name.');
      if (budget < 0) return formErr(form, 'The limit can’t be negative.');
      if (state.categories.some(x => x !== c && x.name.toLowerCase() === name.toLowerCase())) return formErr(form, 'You already have a category with that name.');
      if (c) Object.assign(c, { name, budget });
      else state.categories.splice(state.categories.length - 1, 0, { id:uid(), name, budget, color:CAT_COLORS[state.categories.length % CAT_COLORS.length] });
      save();
    },
  });
  const del = $('[data-del]', form);
  if (del) del.onclick = () => {
    if (!confirm(`Delete “${c.name}”? Its spending moves to Other.`)) return;
    for (const e of state.entries) if (e.cat === c.id) e.cat = 'other';
    for (const s of state.subs) if (s.cat === c.id) s.cat = 'other';
    state.categories = state.categories.filter(x => x !== c);
    dlg.close(); save(); toast(`${c.name} deleted`);
  };
}

/* ---------- IndexedDB (backup folder + key live here) ---------- */
let dbP;
function idb() {
  return dbP ||= new Promise((res, rej) => {
    const r = indexedDB.open('daybook', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('kv');
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
}
async function idbGet(k) { const db = await idb(); return new Promise((res, rej) => { const q = db.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); }
async function idbSet(k, v) { const db = await idb(); return new Promise((res, rej) => { const tx = db.transaction('kv', 'readwrite'); tx.objectStore('kv').put(v, k); tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error); }); }

/* ---------- encryption ---------- */
const te = new TextEncoder(), td = new TextDecoder();
function b64(buf) { const b = new Uint8Array(buf); let s = ''; for (let i = 0; i < b.length; i += 0x8000) s += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000)); return btoa(s); }
function unb64(s) { const bin = atob(s); const b = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) b[i] = bin.charCodeAt(i); return b; }
async function deriveKey(pw, salt, iterations) {
  const base = await crypto.subtle.importKey('raw', te.encode(pw), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name:'PBKDF2', salt, iterations, hash:'SHA-256' }, base, { name:'AES-GCM', length:256 }, false, ['encrypt', 'decrypt']);
}
async function encryptState({ key, salt, iterations }) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({ name:'AES-GCM', iv }, key, te.encode(JSON.stringify(state)));
  return { app:'daybook', format:1, encrypted:true, createdAt:new Date().toISOString(),
    kdf:{ name:'PBKDF2', hash:'SHA-256', iterations, salt:b64(salt) }, cipher:'AES-GCM', iv:b64(iv), data:b64(ct) };
}
async function decryptBackup(obj, pw) {
  const salt = unb64(obj.kdf.salt), iterations = obj.kdf.iterations;
  const key = await deriveKey(pw, salt, iterations);
  const pt = await crypto.subtle.decrypt({ name:'AES-GCM', iv:unb64(obj.iv) }, key, unb64(obj.data));
  return { data: JSON.parse(td.decode(pt)), keyInfo: { key, salt, iterations } };
}

/* ---------- backups ---------- */
const Backup = {
  supported: typeof window.showDirectoryPicker === 'function',
  handle: null, keyInfo: null, lastAt: Number(lsGet('daybook.lastBackup')) || 0,
  status: 'no-password', error: '', timer: null, running: false, pending: false,
  get key() { return this.keyInfo?.key; },
  async init() {
    try { this.handle = (await idbGet('dir')) || null; this.keyInfo = (await idbGet('key')) || null; } catch {}
    await this.refresh();
    if (this.status === 'ready' && Date.now() - this.lastAt > 864e5) this.schedule();
  },
  async refresh() {
    if (!this.key) this.status = 'no-password';
    else if (!this.supported) this.status = 'manual';
    else if (!this.handle) this.status = 'no-folder';
    else {
      let p = 'denied';
      try { p = await this.handle.queryPermission({ mode:'readwrite' }); } catch {}
      this.status = p === 'granted' ? (this.error ? 'error' : 'ready') : 'needs-permission';
    }
    renderChrome();
    if (view === 'settings') render();
  },
  schedule() {
    if (this.status !== 'ready' && this.status !== 'error') return;
    clearTimeout(this.timer); this.pending = true;
    this.timer = setTimeout(() => this.run(), 3000);
  },
  async run() {
    clearTimeout(this.timer); this.pending = false;
    if (!this.key || !this.handle) return false;
    if (this.running) { this.pending = true; return false; }
    // Never overwrite a good backup with an empty Daybook.
    if (!state.entries.length && !state.subs.length) return false;
    this.running = true;
    try {
      if (await this.handle.queryPermission({ mode:'readwrite' }) !== 'granted') { this.status = 'needs-permission'; return false; }
      const text = JSON.stringify(await encryptState(this.keyInfo));
      await writeFile(this.handle, 'daybook-backup.json', text);
      await writeFile(this.handle, `daybook-${ymd(new Date())}.json`, text);
      await pruneDaily(this.handle);
      this.lastAt = Date.now(); lsSet('daybook.lastBackup', String(this.lastAt));
      this.error = ''; this.status = 'ready';
      return true;
    } catch (err) {
      this.error = err?.message || String(err); this.status = 'error';
      return false;
    } finally {
      this.running = false;
      renderChrome();
      if (view === 'settings') render();
      if (this.pending) this.schedule();
    }
  },
  async setPassword(pw) {
    const salt = crypto.getRandomValues(new Uint8Array(16));
    await this.adoptKey({ key: await deriveKey(pw, salt, KDF_ITERATIONS), salt, iterations: KDF_ITERATIONS });
  },
  async adoptKey(keyInfo) {
    this.keyInfo = keyInfo;
    try { await idbSet('key', keyInfo); } catch {}
    await this.refresh();
    if (this.status === 'ready') this.run();
    Sync.schedule(0);
  },
  async chooseFolder() {
    let h;
    try { h = await window.showDirectoryPicker({ id:'daybook-backup', mode:'readwrite', startIn:'documents' }); }
    catch (err) { if (err?.name !== 'AbortError') toast("Couldn't use that folder. Try another one."); return; }
    this.handle = h; this.error = '';
    try { await idbSet('dir', h); } catch {}
    await this.refresh();
    if (this.status === 'ready') { const ok = await this.run(); toast(ok ? `Backed up to “${h.name}”` : `Backups will save to “${h.name}”`); }
  },
  async reconnect() {
    if (!this.handle) return;
    try { await this.handle.requestPermission({ mode:'readwrite' }); } catch {}
    this.error = '';
    await this.refresh();
    if (this.status === 'ready') { await this.run(); toast('Backups reconnected'); }
  },
};
async function writeFile(dir, name, text) {
  const fh = await dir.getFileHandle(name, { create:true });
  const w = await fh.createWritable();
  await w.write(text); await w.close();
}
async function pruneDaily(dir) {
  const names = [];
  for await (const [name, h] of dir.entries()) if (h.kind === 'file' && /^daybook-\d{4}-\d{2}-\d{2}\.json$/.test(name)) names.push(name);
  names.sort().reverse();
  for (const n of names.slice(KEEP_DAILY)) await dir.removeEntry(n);
}

/* ---------- Google Drive sync ---------- */
// One encrypted file in the app's hidden Drive folder. Each run: download, merge, upload.
async function decryptWithKey(keyInfo, obj) {
  const pt = await crypto.subtle.decrypt({ name:'AES-GCM', iv:unb64(obj.iv) }, keyInfo.key, unb64(obj.data));
  return JSON.parse(td.decode(pt));
}
const Sync = {
  enabled: !!GOOGLE_CLIENT_ID && location.protocol === 'https:',
  st: (() => { try { return JSON.parse(lsGet('daybook.sync')) || {}; } catch { return {}; } })(),
  token: null, exp: 0, status: 'idle', error: '', locked: null,
  timer: null, running: false, again: false,
  persist() { lsSet('daybook.sync', JSON.stringify(this.st)); },
  tokenOk() { return !!this.token && this.exp > Date.now() + 30000; },
  setStatus(s) { this.status = s; renderChrome(); if (view === 'settings') render(); },
  loadToken() {
    try { const t = JSON.parse(lsGet('daybook.gtoken')); if (t && t.exp > Date.now()) { this.token = t.token; this.exp = t.exp; } } catch {}
  },
  redirectUri() { return location.origin + location.pathname.replace(/index\.html$/, ''); },
  signIn(silent) {
    const nonce = uid();
    lsSet('daybook.oauthState', nonce);
    const p = new URLSearchParams({ client_id:GOOGLE_CLIENT_ID, redirect_uri:this.redirectUri(), response_type:'token', scope:DRIVE_SCOPE, include_granted_scopes:'true', state:nonce });
    if (silent) p.set('prompt', 'none');
    location.assign('https://accounts.google.com/o/oauth2/v2/auth?' + p);
  },
  // Google sends the token back in the URL hash; read it, then clean the URL.
  handleRedirect() {
    const h = location.hash.slice(1);
    if (!/(^|&)(access_token|error)=/.test(h)) return;
    const p = new URLSearchParams(h);
    const expected = lsGet('daybook.oauthState');
    history.replaceState(null, '', location.pathname + location.search + '#today');
    if (!expected || p.get('state') !== expected) return;
    lsSet('daybook.oauthState', '');
    if (p.get('error')) { if (this.st.on) this.status = 'signin'; if (p.get('error') === 'access_denied') toast('Google access was declined'); return; }
    if (!(p.get('scope') || '').includes('drive.appdata')) { toast('Allow Google Drive access to sync'); return; }
    this.token = p.get('access_token');
    this.exp = Date.now() + (Number(p.get('expires_in')) || 3600) * 1000;
    lsSet('daybook.gtoken', JSON.stringify({ token:this.token, exp:this.exp }));
    if (!this.st.on) { this.st.on = true; this.persist(); }
  },
  // Token expired: bounce through Google silently, at most once per 10 minutes, never over unsaved typing.
  maybeSilent() {
    if (!this.enabled || !this.st.on || this.tokenOk()) return;
    const last = Number(lsGet('daybook.silentAt')) || 0;
    if (Date.now() - last < 10 * 60e3 || draft.trim() || noteDraft.trim() || dlg.open) { this.setStatus('signin'); return; }
    lsSet('daybook.silentAt', String(Date.now()));
    this.signIn(true);
  },
  start() {
    if (!this.enabled || !this.st.on) return;
    if (this.tokenOk()) this.run(); else this.maybeSilent();
    setInterval(() => { if (!document.hidden) { if (this.tokenOk()) this.run(); else this.maybeSilent(); } }, 60000);
  },
  schedule(ms = 2500) {
    if (!this.enabled || !this.st.on) return;
    clearTimeout(this.timer);
    this.timer = setTimeout(() => this.run(), ms);
  },
  async api(url, opts = {}) {
    const res = await fetch(url, { ...opts, headers: { ...(opts.headers || {}), Authorization: 'Bearer ' + this.token } });
    if (res.status === 401) { this.token = null; this.exp = 0; lsSet('daybook.gtoken', 'null'); throw Object.assign(new Error('signin'), { signin:true }); }
    if (!res.ok) {
      let reason = '', msg = '';
      try { const j = await res.json(); reason = j.error?.errors?.[0]?.reason || j.error?.status || ''; msg = j.error?.message || ''; } catch {}
      if (reason === 'accessNotConfigured' || /has not been used|is disabled/i.test(msg)) throw new Error('Google Drive API is off. Enable it in your Google Cloud project.');
      if (reason === 'insufficientPermissions' || /insufficient/i.test(msg)) throw new Error('Drive access wasn’t allowed. Disconnect, then connect and tick the Drive box.');
      throw new Error(`Google Drive error ${res.status}${msg ? ': ' + msg : ''}`);
    }
    return res;
  },
  async findFile() {
    const q = encodeURIComponent(`name='${SYNC_FILE}'`);
    const r = await (await this.api(`https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&q=${q}&fields=files(id)&pageSize=10`)).json();
    return r.files?.[0]?.id || null;
  },
  async download(id) { return (await this.api(`https://www.googleapis.com/drive/v3/files/${id}?alt=media`)).json(); },
  async upload(id, obj) {
    const body = JSON.stringify(obj);
    if (id) {
      await this.api(`https://www.googleapis.com/upload/drive/v3/files/${id}?uploadType=media`, { method:'PATCH', headers:{ 'Content-Type':'application/json' }, body });
      return id;
    }
    const b = 'daybook' + uid();
    const meta = JSON.stringify({ name:SYNC_FILE, parents:['appDataFolder'] });
    const multipart = `--${b}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${meta}\r\n--${b}\r\nContent-Type: application/json\r\n\r\n${body}\r\n--${b}--`;
    const r = await (await this.api('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id', { method:'POST', headers:{ 'Content-Type':`multipart/related; boundary=${b}` }, body:multipart })).json();
    return r.id;
  },
  async run() {

    if (!this.tokenOk()) { this.setStatus('signin'); return; }
    this.running = true;
    this.setStatus('syncing');
    try {
      let id = this.st.fileId || await this.findFile();
      let remote = null;
      if (id) {
        try { remote = await this.download(id); }
        catch (e) { if (e.signin) throw e; id = await this.findFile(); remote = id ? await this.download(id) : null; }
      }
      if (remote) {
        let data = null;
        if (Backup.key && b64(Backup.keyInfo.salt) === remote.kdf?.salt) {
          try { data = normalize(await decryptWithKey(Backup.keyInfo, remote)); } catch {}
        }
        if (!data) { this.locked = remote; this.setStatus('locked'); return; }
        const merged = mergeStates(state, data);
        if (JSON.stringify(merged) !== JSON.stringify(state)) applyMerged(merged);
        if (JSON.stringify(state) !== JSON.stringify(data)) id = await this.upload(id, await encryptState(Backup.keyInfo));
      } else {
        if (!Backup.key) { this.setStatus('nokey'); return; }
        id = await this.upload(null, await encryptState(Backup.keyInfo));
      }
      this.st.fileId = id; this.st.lastAt = Date.now(); this.persist();
      this.locked = null; this.error = '';
      this.setStatus('ok');
    } catch (e) {
      if (e.signin) this.setStatus('signin');
      else { this.error = e.message || String(e); this.setStatus('error'); }
    } finally {
      this.running = false;
      if (this.again) { this.again = false; this.schedule(500); }
    }
  },
  disconnect() {
    if (this.token) fetch('https://oauth2.googleapis.com/revoke?token=' + encodeURIComponent(this.token), { method:'POST' }).catch(() => {});
    this.st = {}; this.persist();
    this.token = null; this.exp = 0; lsSet('daybook.gtoken', 'null');
    this.locked = null;
    this.setStatus('idle');
    toast('Sync turned off on this device');
  },
};
function syncUnlockDialog() {
  const remote = Sync.locked;
  if (!remote) { Sync.run(); return; }
  openDialog({
    title: 'Unlock sync',
    submit: 'Unlock',
    body: `<label class="field"><span>Backup password from your other device</span><input name="pw" type="password" autocomplete="current-password" required></label>`,
    async onSubmit(fd, form) {

function syncCard() {
  const S = Sync;

async function downloadBackup() {
  let obj;
  if (Backup.key) obj = await encryptState(Backup.keyInfo);
  else {
    if (!confirm("You haven't set a backup password, so anyone who opens this file can read it. Download anyway?\n\n(Set a password in Settings → Automatic backups to encrypt it.)")) return;
    obj = { app:'daybook', format:1, encrypted:false, createdAt:new Date().toISOString(), data:state };
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(obj)], { type:'application/json' }));
  a.download = `daybook-${ymd(new Date())}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
async function restoreFromFile(file) {
  let obj;
  try { obj = JSON.parse(await file.text()); } catch { obj = null; }
  if (!obj || obj.app !== 'daybook') { toast("That file isn't a Daybook backup."); return; }
  if (!obj.encrypted) { applyRestore(obj.data, obj.createdAt); return; }
  openDialog({
    title: 'Unlock backup',
    submit: 'Unlock',
    body: `
      <label class="field"><span>Backup password</span><input name="pw" type="password" autocomplete="current-password" required></label>`,
    async onSubmit(fd, form) {
      let r;
      try { r = await decryptBackup(obj, String(fd.get('pw'))); }
      catch { return formErr(form, 'Wrong password, or the file is damaged. Try again.'); }
      applyRestore(r.data, obj.createdAt, r.keyInfo);
    },
  });
}
function applyRestore(data, when, keyInfo) {
  const n = normalize(data);
  const whenTxt = when ? new Date(when).toLocaleString() : 'an unknown date';
  if (!confirm(`Restore the backup from ${whenTxt}?\n\nIt has ${n.entries.length} entries and ${n.subs.length} subscriptions. Everything currently in Daybook on this device will be replaced.`)) return;
  state = n; applyTheme(); save();
  if (keyInfo && !Backup.key) { Backup.adoptKey(keyInfo); toast('Restored. Your backup password is set too — choose a folder to keep backing up.'); }
  else toast('Backup restored');
}

  openDialog({

$('#skip').addEventListener('click', () => $('#main h1')?.focus());
window.addEventListener('hashchange', () => route(true));
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { if (Backup.pending) Backup.run(); }
  else if (Sync.st.on) { if (Sync.tokenOk()) Sync.run(); else Sync.maybeSilent(); }
});
window.addEventListener('storage', ev => { if (ev.key === STORE_KEY) { state = normalize(JSON.parse(ev.newValue)); snap = snapshotOf(state); render(); } });
setInterval(renderChrome, 60000);

applyTheme();
Sync.loadToken();
Sync.handleRedirect();
route(false);
Backup.init();
Sync.start();
// Offline + installable only on the real https site, so local testing never serves stale files.
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
